name: Security Review

# Claude reviews every pull request for security problems before it lands, and
# leaves its findings as PR comments. Needs an Anthropic API key stored as the
# CLAUDE_API_KEY repository secret (Settings → Secrets and variables → Actions);
# without it the job fails fast rather than silently passing.

permissions:
  pull-requests: write   # to leave the findings as review comments
  contents: read

on:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # Pinned to a commit rather than @main: a mutable tag means whatever that
      # branch points at on the day this runs gets your repository contents and
      # your API key. Bump it deliberately after reading the diff.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda  # main @ 2026-02-11
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          exclude-directories: node_modules
