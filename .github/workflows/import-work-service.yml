name: One-time import from work-service
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-work-service.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Copy every tracked source file including binary assets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://github.com/viztrrx/work-service.git "$RUNNER_TEMP/work-service-source"
          rsync --archive --delete --exclude='.git/' "$RUNNER_TEMP/work-service-source/" "$GITHUB_WORKSPACE/"
          test -s script.js
          test -f worker.js
          test -f proxy-worker/index.js
          diff --recursive --brief --exclude=.git "$RUNNER_TEMP/work-service-source" "$GITHUB_WORKSPACE"
          echo "Source and destination files match exactly."

      - name: Commit source snapshot to destination main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "All files already match."
            exit 0
          fi
          git commit -m "Copy complete work-service source tree and assets"
          git push origin HEAD:main
