<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eaglercraft</title>
<!--
  The Eaglercraft tab's game frame. worker.js serves this page at /eagler/
  with a Content-Security-Policy that only allows connections back to the
  worker, so everything the game loads or connects to goes through it.
  config.js is generated by the worker; bridge.js is in this folder.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  /* EaglercraftX looks the container up by id and sizes its canvas to it. */
  #game_frame { position: fixed; inset: 0; }
</style>
<script src="config.js"></script>
<script src="loader/chromebox-lite.js"></script>
<script src="loader/resource-packs.js"></script>
<script src="loader/bridge.js"></script>
</head>
<body>
<div id="game_frame"></div>
</body>
</html>
